name: Gerar Tempo.app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar Tempo.app
        run: bash build_mac.sh

      - name: Compactar e criar DMG
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Tempo.app ../Tempo-mac.zip
          mkdir -p ../dmg-src && cp -R Tempo.app ../dmg-src/ && ln -s /Applications ../dmg-src/Applications
          cd ..
          hdiutil create -volname "Tempo" -srcfolder dmg-src -ov -format UDZO Tempo.dmg
          ls -la Tempo.dmg Tempo-mac.zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < VERSION)"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" Tempo.dmg Tempo-mac.zip \
            --title "Tempo $TAG" \
            --notes "Instalação: abra o Tempo.dmg e arraste o Tempo para Aplicativos. Na primeira vez, clique com o botão direito e escolha Abrir."
